<!DOCTYPE html>
<html>

<head>
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}Personal website of Philip Fradkin, cofounder at blank.bio building RNA foundation models.{% endif %}">
    <link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    {% feed_meta %}

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9Y7WYDM9DP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9Y7WYDM9DP');
    </script>

</head>

<body>
    <div class="split-screen">
        <div class="left">
            <div class="entry">
                <h1 class="name">Philip Fradkin</h1>
            </div>
            <div class="profile-photo">
                <img src="{{ "/images/Phil.jpg" | relative_url }}" alt="Your Photo" class="profile-photo">
            </div>
            <div class="entry">
                <a href="mailto:phil.fradkin@gmail.com" target="_blank" class="social-link"><i class="fa fa-envelope"
                        aria-hidden="true"></i> phil.fradkin@gmail.com</a>
            </div>
            <div class="entry">
                <a href="https://www.linkedin.com/in/philip-fradkin-330a417b/" target="_blank" class="social-link"><i
                        class="fab fa-linkedin"></i> LinkedIn</a>
            </div>
            <div class="entry">
                <a href="https://twitter.com/phil_fradkin" target="_blank" class="social-link"><i
                        class="fab fa-twitter"></i> Twitter</a>
            </div>
            <div class="entry">
                <a href="/pdf/Philip_Fradkin_2025.pdf" target="_blank" class="social-link"><i
                        class="fas fa-file-alt"></i>
                    Resume</a>
            </div>

            <!-- Section Navigation -->
            <hr style="width: 80%; margin: 20px auto; border: 0; height: 1px; background-color: #b7c1c7;">

            <div class="entry">
                <a href="#writing" class="social-link"><i class="fas fa-pen-nib fa-fw"></i> Writing</a>
            </div>
            <div class="entry">
                <a href="#timeline" class="social-link"><i class="fas fa-stream fa-fw"></i> Timeline</a>
            </div>
            <div class="entry">
                <a href="#science-communication" class="social-link"><i class="fas fa-flask fa-fw"></i> SciComm</a>
            </div>
            <div class="entry">
                <a href="#talks" class="social-link"><i class="fas fa-comment-dots fa-fw"></i> Talks</a>
            </div>

            <!-- Other Pages -->
            <hr style="width: 80%; margin: 20px auto; border: 0; height: 1px; background-color: #b7c1c7;">
            <div class="entry">
                <a href="#misc" class="social-link"><i class="fas fa-book-open fa-fw"></i> Reading List</a>
            </div>

            <div class="sidebar-subscribe">
                {% include subscribe.html compact=true %}
            </div>

            <div class="theme-switch-wrapper">
                <span class="theme-name">Light</span>
                <label class="theme-switch" for="theme-toggle-checkbox">
                    <input type="checkbox" id="theme-toggle-checkbox" />
                    <span class="slider round"></span>
                </label>
                <span class="theme-name">Dark</span>
            </div>
        </div>
        <div class="right">
            <div class="text-content">
                {{content}}
            </div>
        </div>
    </div>

    <script>
        const themeToggleCheckbox = document.getElementById('theme-toggle-checkbox');

        const applyTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleCheckbox.checked = theme === 'dark';
        };

        themeToggleCheckbox.addEventListener('change', () => {
            applyTheme(themeToggleCheckbox.checked ? 'dark' : 'light');
        });

        // Sync checkbox with theme already applied by the head script
        themeToggleCheckbox.checked = document.documentElement.getAttribute('data-theme') === 'dark';
    </script>
</body>

</html>
