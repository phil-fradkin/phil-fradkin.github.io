<!DOCTYPE html>
<html>

<head>
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}Personal website of Philip Fradkin, cofounder at blank.bio building RNA foundation models.{% endif %}">
    <link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relative_url }}">
    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">
    {% feed_meta %}

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9Y7WYDM9DP"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-9Y7WYDM9DP');
    </script>
</head>

<body>
    <div class="default_background">
        <div class="text-content">
            {{content}}
        </div>
        <footer class="site-footer">
            {% include subscribe.html %}
        </footer>
    </div>
</body>

</html>
